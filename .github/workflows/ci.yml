name: ci

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-test-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build and test
        run: |
          set -o pipefail
          { cargo build --release --verbose && cargo test --release; } 2>&1 | tee /tmp/build.log

      - name: render examples
        run: |
          set -o pipefail
          { ./target/release/bfviz examples/add.bf -o /tmp/add.gif < /dev/null
            ./target/release/bfviz examples/hello.bf -o /tmp/hello.gif < /dev/null
            ./target/release/bfviz examples/stars.bf -o /tmp/stars.gif < /dev/null
            printf 'hi\n' | ./target/release/bfviz examples/cat.bf -o /tmp/cat.gif
          } 2>&1 | tee /tmp/render.log

      - name: verify gifs and extract frames
        run: |
          python3 -m pip install --quiet pillow
          python3 ci/check.py

      - name: report to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep the PR tidy: drop this bot's earlier comments
          gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions" or .user.login == "github-actions[bot]") | .id' 2>/dev/null \
            | while read -r id; do
                gh api "repos/$GITHUB_REPOSITORY/issues/1/comments/$id" -X DELETE 2>/dev/null || true
              done
          {
            echo "CI run ${{ github.run_id }} for ${{ github.sha }}: **${{ job.status }}**"
            echo '```'
            tail -c 3000 /tmp/build.log 2>/dev/null || true
            echo '```'
            echo '```'
            cat /tmp/render.log 2>/dev/null || true
            echo '```'
          } > /tmp/report.md
          gh pr comment 1 --body-file /tmp/report.md || echo "could not comment"

      # base64 frames are only needed when the rendering sandbox cannot fetch
      # artifacts; trigger with a commit message containing [frames]
      - name: post frames to PR
        if: success() && contains(github.event.head_commit.message, '[frames]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          from PIL import Image
          import base64, io
          sel = ['add_intro', 'add_b', 'hello_b', 'cat_a']
          parts = [f"frames from run (512x288 jpeg b64):"]
          for n in sel:
              im = Image.open(f'/tmp/frames/{n}.png').convert('RGB').resize((512, 288))
              buf = io.BytesIO()
              im.save(buf, 'JPEG', quality=70)
              parts.append(f'=== {n} ===')
              parts.append(base64.b64encode(buf.getvalue()).decode())
          open('/tmp/frames_b64.txt', 'w').write('\n'.join(parts))
          EOF
          gh pr comment 1 --body-file /tmp/frames_b64.txt || echo "could not comment"

      - name: publish frames branch
        if: success()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-frames
          mkdir -p ci_frames
          cp /tmp/frames/*.png ci_frames/ || true
          cp /tmp/add.gif /tmp/cat.gif ci_frames/ || true
          git add -A ci_frames
          git commit -m "ci frames from run ${{ github.run_id }}" || true
          git push origin ci-frames || echo "push failed (token read-only) — frames travel via PR comment"
